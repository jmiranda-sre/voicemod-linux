[package]
name = "vm-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nnnoiseless = "0.5.2"
rustfft = "6"
deep_filter = { version = "0.2.5", optional = true }
tract-onnx = { version = "0.23.9", optional = true }
tract-pulse = { version = "0.23.9", optional = true }
rust-ini = { version = "0.21.3", optional = true }
flate2 = { version = "1.1.10", optional = true }
tar = { version = "0.4.46", optional = true }
tract-hir = { version = "0.23.9", optional = true }
tract-data = { version = "0.23.9", optional = true }

[features]
# Full neural stack: RNNoise weights are always bundled (nnnoiseless);
# the DeepFilterNet runtime (tract sessions + model loader) is opt-in
# to keep default builds lean.
neural = ["dep:deep_filter", "dep:tract-onnx", "dep:tract-pulse", "dep:tract-hir", "dep:rust-ini", "dep:flate2", "dep:tar", "dep:tract-data"]
