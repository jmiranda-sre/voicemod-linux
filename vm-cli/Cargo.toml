[package]
name = "vm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-tungstenite = "0.26"
futures-util = "0.3"
vm-audio = { path = "../vm-audio" }
vm-preset = { path = "../vm-preset" }
vm-control = { path = "../vm-control" }
vm-soundboard = { path = "../vm-soundboard" }
