[package]
name = "vm-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vm-daemon"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde_json.workspace = true
vm-audio = { path = "../vm-audio" }
vm-dsp = { path = "../vm-dsp" }
vm-soundboard = { path = "../vm-soundboard" }
vm-preset = { path = "../vm-preset" }
vm-control = { path = "../vm-control" }
vm-obs = { path = "../vm-obs" }
vm-midi = { path = "../vm-midi", optional = true }

[features]
default = []
# Physical MIDI learn (ALSA sequencer, native libasound). Off by default so
# the lean build stays dependency-free: `cargo build --release -p vm-daemon
# --features midi`.
midi = ["dep:vm-midi"]

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
